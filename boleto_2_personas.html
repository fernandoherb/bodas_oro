<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boleto de Recepción (2 Personas) - Bodas de Oro</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f1ea;
        }
        h1, h2, h3, h4 {
            font-family: 'Cinzel', serif;
        }
        .script-font {
            font-family: 'Great Vibes', cursive;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===================================================== */
        /*  EDITA AQUÍ: nombre del lugar y dirección de la recepción */
        /* ===================================================== */

        /* Ticket look & feel */
        .ticket {
            width: 100%;
            max-width: 820px;
            display: grid;
            grid-template-columns: 1fr 220px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            position: relative;
        }
        .ticket-main {
            padding: 3rem 3rem 2.5rem 3rem;
            position: relative;
        }
        .ticket-stub {
            background: #1a1a1a;
            border-radius: 0 18px 18px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            position: relative;
        }
        /* Línea perforada entre el cuerpo y el talón */
        .ticket-main::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 0;
            border-right: 2px dashed #d9d2c2;
        }
        /* Muescas circulares (efecto boleto real) */
        .ticket-stub::before,
        .ticket-stub::after {
            content: '';
            position: absolute;
            left: -14px;
            width: 28px;
            height: 28px;
            background: #f4f1ea;
            border-radius: 50%;
        }
        .ticket-stub::before { top: -14px; }
        .ticket-stub::after { bottom: -14px; }

        .field-label {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #b38728;
            font-weight: 700;
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="ticket">
        <!-- Cuerpo del boleto -->
        <div class="ticket-main">
            <p class="uppercase tracking-[0.3em] text-[11px] text-gray-400 mb-3">Bodas de Oro &bull; Cumpleaños 70</p>
            <h1 class="gold-gradient font-bold text-3xl md:text-4xl leading-tight mb-1">Margarita &amp; Fernando</h1>
            <p class="script-font text-2xl text-gray-500 mb-8">Recepción Sorpresa</p>

            <div class="grid grid-cols-2 gap-x-8 gap-y-6 mb-8">
                <div class="col-span-2">
                    <p class="field-label">Lugar</p>
                    <p class="font-semibold text-gray-800 text-lg">[NOMBRE DEL LUGAR]</p>
                </div>
                <div class="col-span-2">
                    <p class="field-label">Dirección</p>
                    <p class="text-gray-700 text-sm leading-relaxed">[DIRECCIÓN COMPLETA DEL LUGAR]</p>
                </div>
                <div>
                    <p class="field-label">Fecha</p>
                    <p class="text-gray-800 font-semibold">17 de Octubre, 2026</p>
                </div>
                <div>
                    <p class="field-label">Horario</p>
                    <p class="text-gray-800 font-semibold">3:00 PM &ndash; 10:00 PM</p>
                </div>
            </div>

            <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em]">Evento Privado &bull; Estrictamente Sorpresa</p>
        </div>

        <!-- Talón del boleto -->
        <div class="ticket-stub">
            <div class="w-14 h-14 rounded-full border border-amber-400/60 flex items-center justify-center mb-4">
                <span class="text-amber-400 text-xs font-bold italic">50|70</span>
            </div>
            <p class="uppercase text-[10px] tracking-[0.2em] text-gray-400 mb-2">Boleto para</p>
            <p class="text-5xl font-black text-amber-400 leading-none mb-1">2</p>
            <p class="uppercase text-xs tracking-[0.2em] text-gray-300">Personas</p>
        </div>
    </div>

</body>
</html>
